<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your account | Hotel Revenue Manager</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="card">
    <h1>Create your account</h1>
    <p class="lede">Hotel Revenue Manager recommends a nightly rate for every room type on every date. Your pricing data stays private to your account.</p>

    <form id="register-form" novalidate>
      <div class="field">
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" autocomplete="name" aria-describedby="name-error">
        <p class="error" id="name-error" role="alert"></p>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error">
        <p class="error" id="email-error" role="alert"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-hint password-error">
        <p class="hint" id="password-hint">At least 8 characters.</p>
        <p class="error" id="password-error" role="alert"></p>
      </div>

      <p class="error form-error" id="form-error" role="alert"></p>

      <button type="submit" id="submit">Create account</button>
    </form>

    <p class="signin">Already have an account? <a href="/login">Sign in</a></p>

    <div class="done" id="done" hidden>
      <h2>You are signed in</h2>
      <p id="done-detail"></p>
    </div>
  </main>

  <script src="/shared/validation.js"></script>
  <script src="/register.js"></script>
</body>
</html>
